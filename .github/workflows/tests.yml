name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  django:
    name: Python ${{ matrix.python }} / PostgreSQL 17
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.14']
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: arcave_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-only-local-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d arcave_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: django_project
    env:
      # Disposable values for the isolated service; no repository secrets required.
      DJANGO_DEBUG: 'True'
      DJANGO_SECRET_KEY: ci-only-disposable-key-0123456789-abcdefghijklmnopqrstuvwxyz
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,testserver
      DB_NAME: arcave_ci
      DB_USER: postgres
      DB_PASSWORD: ci-only-local-password
      DB_HOST: 127.0.0.1
      DB_PORT: '5432'
      TEST_DB_NAME: test_arcave_ci
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: 'django_project/requirements*.txt'
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Validate application and migration state
        run: |
          python manage.py check
          python manage.py makemigrations --check --dry-run
          python manage.py migrate --noinput
          python -m pip check
      - name: Run all tests with PostgreSQL row locks
        run: python -m coverage run --source=accounts,shop,arcave manage.py test accounts shop arcave --settings=arcave.test_settings --noinput --verbosity=2
      - name: Show coverage
        if: always()
        run: python -m coverage report --skip-empty
